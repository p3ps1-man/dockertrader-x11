[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:terminal64]
user=mt5
command=/bin/bash -c 'wine terminal64.exe; wineserver -w'
directory=/home/mt5/.wine/drive_c/Program Files/MetaTrader 5
autostart=true
autorestart=true
startsecs=10
startretries=100
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/terminal64.log
stdout_logfile_maxbytes=0